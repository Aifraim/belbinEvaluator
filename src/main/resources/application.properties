spring.application.name=belbinEvaluator

# H2 file-based DB (persists between restarts)
spring.datasource.url=jdbc:h2:file:./belbin-db
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# H2 web console at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# App port (optional, 8080 is default)
server.port=8080