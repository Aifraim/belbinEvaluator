<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Your Results – Belbin Evaluator</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="container">

    <h1 th:text="'Results for ' + ${submission.participantName}"></h1>
    <p class="subtitle" th:text="'Test completed on ' + ${#temporals.format(submission.takenAt, 'dd MMM yyyy, HH:mm')}"></p>

    <!-- Top 3 roles highlight - podium -->
    <div class="top-roles">
        <h2>Your Top Roles</h2>

        <div class="podium">

            <!-- 2nd place (left) -->
            <div class="podium-slot second" th:if="${topRoles.size() >= 2}">
                <div class="podium-card">
                    <div class="podium-rank">🥈</div>
                    <div class="podium-name" th:text="${topRoles[1].displayName}"></div>
                    <div class="podium-category"
                         th:text="${topRoles[1].category.name() == 'SOCIAL'} ? '🤝 Social'
                             : (${topRoles[1].category.name() == 'THINKING'} ? '💡 Thinking'
                             : '⚙️ Task')">
                    </div>
                    <div class="podium-score" th:text="${percentages.get(topRoles[1])} + '%'"></div>
                </div>
                <div class="podium-block second-block">2</div>
            </div>

            <!-- 1st place (center, tallest) -->
            <div class="podium-slot first" th:if="${topRoles.size() >= 1}">
                <div class="podium-card">
                    <div class="podium-rank">🥇</div>
                    <div class="podium-name" th:text="${topRoles[0].displayName}"></div>
                    <div class="podium-category"
                         th:text="${topRoles[0].category.name() == 'SOCIAL'} ? '🤝 Social'
                             : (${topRoles[0].category.name() == 'THINKING'} ? '💡 Thinking'
                             : '⚙️ Task')">
                    </div>
                    <div class="podium-score" th:text="${percentages.get(topRoles[0])} + '%'"></div>
                </div>
                <div class="podium-block first-block">1</div>
            </div>

            <!-- 3rd place (right) -->
            <div class="podium-slot third" th:if="${topRoles.size() >= 3}">
                <div class="podium-card">
                    <div class="podium-rank">🥉</div>
                    <div class="podium-name" th:text="${topRoles[2].displayName}"></div>
                    <div class="podium-category"
                         th:text="${topRoles[2].category.name() == 'SOCIAL'} ? '🤝 Social'
                             : (${topRoles[2].category.name() == 'THINKING'} ? '💡 Thinking'
                             : '⚙️ Task')">
                    </div>
                    <div class="podium-score" th:text="${percentages.get(topRoles[2])} + '%'"></div>
                </div>
                <div class="podium-block third-block">3</div>
            </div>

        </div>
    </div>

    <!-- Grouped breakdown by category -->
    <div class="full-results">
        <h2>Full Breakdown</h2>

        <div th:each="group : ${groupedRoles}">

            <div class="category-header"
                 th:classappend="${group.key.name() == 'SOCIAL'} ? 'social'
                               : (${group.key.name() == 'THINKING'} ? 'thinking'
                               : 'task')">
                <span th:text="${group.key.name() == 'SOCIAL'} ? '🤝 Social Roles'
                             : (${group.key.name() == 'THINKING'} ? '💡 Thinking Roles'
                             : '⚙️ Task Roles')">
                </span>
            </div>

            <table class="results-table">
                <thead>
                <tr>
                    <th>Role</th>
                    <th>Points</th>
                    <th>Percentage</th>
                    <th>Bar</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="entry : ${group.value}">
                    <td th:text="${entry.key.displayName}"></td>
                    <td th:text="${entry.value}"></td>
                    <td th:text="${percentages.get(entry.key)} + '%'"></td>
                    <td>
                        <div class="bar-wrap">
                            <div class="bar"
                                 th:style="'width: ' + ${percentages.get(entry.key)} + '%'">
                            </div>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>

        </div>
    </div>

    <!-- Retake -->
    <div class="actions">
        <a href="/" class="btn">Take the Test Again</a>
    </div>

</div>

</body>
</html>
